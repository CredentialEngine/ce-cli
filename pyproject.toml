[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-cli"
version = "0.1.0"
description = "Credential Engine CLI - Internal platform management tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27,<0.29",
    "keyring>=25",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "requests>=2.31",
    "truststore>=0.9",
    "base58>=2.1",
    "PyJWT>=2.8",
    "cryptography>=41",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0,<3.0.0",
]

[project.scripts]
ce = "ce.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-recording>=0.13",
    "vcrpy>=6",
    "tox>=4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ce*"]

[tool.pytest.ini_options]
addopts = "--record-mode=none"
markers = ["integration: tests that target a live API"]

[tool.vcrpy]
cassette_library_dir   = "tests/cassettes"
record_mode            = "none"
serializer             = "yaml"
match_on               = ["method", "scheme", "host", "port", "path", "query", "body"]
filter_headers         = ["authorization", "Authorization"]
ssl_verify_certificate = false

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = unit, integration
skipsdist = true

[testenv]
deps =
    pytest>=8
    pytest-mock>=3
    pytest-recording>=0.13
    vcrpy>=6
commands_pre =
    pip install -e .

[testenv:unit]
commands = pytest tests/ -m "not integration" --record-mode=none -s {posargs}

[testenv:integration]
commands = pytest tests/ -m integration --record-mode=none -s

[testenv:record]
commands = pytest tests/ -m integration --record-mode=once -s {posargs}
"""