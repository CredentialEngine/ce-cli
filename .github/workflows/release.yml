name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep security scan
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            semgrep/semgrep semgrep scan \
            --verbose --error --strict \
            --no-git-ignore \
            --max-target-bytes 0 \
            --max-log-list-entries 0 \
            --scan-unknown-extensions \
            --config p/secrets \
            --config p/security-audit \
            --config p/python \
            --config p/dockerfile \
            .

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Generate version
        run: echo "VERSION=$(date +%Y.%m.%d).${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ruff pytest-cov
          pip install -e ".[dev]"
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.VERSION }}

      - name: Ruff lint and format checks
        run: |
          ruff check .
          ruff format . --check

      - name: Run unit and offline replay tests with coverage
        run: |
          pytest -m "not integration" --record-mode=none --tb=short \
            --cov=ce --cov-config=.github/coverage.ini \
            --cov-report=term-missing --cov-report=html \
            --cov-report=xml --cov-fail-under=80
        env:
          VCR_RECORD_MODE: none

      - name: Run integration tests (VCR playback)
        run: pytest -m integration --record-mode=none --tb=short
        env:
          VCR_RECORD_MODE: none

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-cli-coverage
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: ignore

      - name: Build package
        run: python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.VERSION }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-cli-drop
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'push' }}
