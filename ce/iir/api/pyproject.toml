[tool.poetry]
name = "iir_client"
version = "v1"
description = "A client library for accessing CTI Directory API"
authors = []
readme = "README.md"
packages = [
    { include = "iir_client" },
]
include = ["iir_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx2 = ">=2.16,<3"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
